
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101018">
<title>MOVIXA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:25px;background:#191923;border-bottom:3px solid #e50914}
.logo{font-size:36px;font-weight:bold;color:#e50914}
header p{color:#ccc}
.search{display:flex;gap:8px;padding:15px;max-width:650px;margin:auto}
input{flex:1;min-width:0;padding:13px;border-radius:8px;border:1px solid #444;background:#252530;color:white;font-size:15px}
button{background:#e50914;color:white;border:0;border-radius:8px;padding:12px 15px;font-weight:bold;cursor:pointer}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px}
nav button{background:#292936}
nav button.active{background:#e50914}
h2{text-align:center;margin:25px 10px}
#msg{text-align:center;padding:15px;color:#ffcaca}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:15px;padding:12px;max-width:1200px;margin:auto}
.card{background:#20202b;border-radius:10px;overflow:hidden;text-align:center;padding-bottom:12px}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#333}
.card h3{font-size:14px;padding:0 7px;min-height:35px}
.rating{color:#ffc107;font-size:13px}
footer{text-align:center;background:#191923;color:#aaa;padding:25px;margin-top:35px}
@media(max-width:400px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>

<header>
<div class="logo">MOVIXA</div>
<p>اكتشف عالم الأفلام والمسلسلات</p>
</header>

<div class="search">
<input id="search" type="search" placeholder="ابحث عن فيلم أو مسلسل...">
<button onclick="searchMovies()">بحث</button>
</div>

<nav>
<button class="active" onclick="load('movie',this)">🎬 الأفلام</button>
<button onclick="load('tv',this)">📺 المسلسلات</button>
<button onclick="load('trending',this)">🔥 الأكثر شهرة</button>
<button onclick="load('top',this)">⭐ الأعلى تقييماً</button>
</nav>

<h2 id="heading">🎬 أشهر الأفلام</h2>
<div id="msg">جاري تحميل المحتوى...</div>
<div class="grid" id="grid"></div>

<footer>MOVIXA © 2026 - جميع الحقوق محفوظة</footer>

<script>
const KEY='ea713bbc78726b1136fb80e64df7b104';
const BASE='https://api.themoviedb.org/3';
const IMG='https://image.tmdb.org/t/p/w500';

const grid=document.getElementById('grid');
const msg=document.getElementById('msg');
const heading=document.getElementById('heading');
const searchInput=document.getElementById('search');

async function api(path){
 const sep=path.includes('?')?'&':'?';
 const response=await fetch(BASE+path+sep+
 'api_key='+encodeURIComponent(KEY)+'&language=ar');
 if(!response.ok)throw new Error('API '+response.status);
 return response.json();
}

function render(items){
 grid.innerHTML='';
 if(!items.length){
  msg.textContent='لم يتم العثور على نتائج';
  return;
 }
 items.forEach(item=>{
  const card=document.createElement('div');
  card.className='card';

  const img=document.createElement('img');
  img.loading='lazy';
  img.alt=item.title||item.name||'MOVIXA';
  if(item.poster_path)img.src=IMG+item.poster_path;

  const title=document.createElement('h3');
  title.textContent=item.title||item.name||'بدون عنوان';

  const rating=document.createElement('div');
  rating.className='rating';
  rating.textContent='⭐ '+(item.vote_average?Number(item.vote_average).toFixed(1):'غير متوفر');

  card.append(img,title,rating);
  grid.appendChild(card);
 });
}

async function load(type,button){
 grid.innerHTML='';
 msg.textContent='جاري تحميل المحتوى...';

 if(button){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
 }

 let path;
 if(type==='movie'){
  heading.textContent='🎬 أشهر الأفلام';
  path='/movie/popular';
 }else if(type==='tv'){
  heading.textContent='📺 أشهر المسلسلات';
  path='/tv/popular';
 }else if(type==='trending'){
  heading.textContent='🔥 الأكثر شهرة';
  path='/trending/all/week';
 }else{
  heading.textContent='⭐ الأعلى تقييماً';
  path='/movie/top_rated';
 }

 try{
  const data=await api(path);
  render(data.results||[]);
  msg.textContent='تم تحميل المحتوى بنجاح 🎉';
 }catch(error){
  msg.textContent='خطأ في التحميل: '+error.message;
  console.error(error);
 }
}

async function searchMovies(){
 const q=searchInput.value.trim();
 if(!q){
  msg.textContent='اكتب اسم الفيلم أو المسلسل';
  return;
 }
 heading.textContent='🔎 نتائج البحث';
 msg.textContent='جاري البحث...';
 grid.innerHTML='';
 try{
  const data=await api('/search/multi?query='+encodeURIComponent(q));
  render((data.results||[]).filter(x=>x.media_type!=='person'));
  msg.textContent='انتهى البحث 🎬';
 }catch(error){
  msg.textContent='خطأ في البحث: '+error.message;
 }
}

searchInput.addEventListener('keydown',e=>{
 if(e.key==='Enter')searchMovies();
});

load('movie');
</script>
</body>
</html>
