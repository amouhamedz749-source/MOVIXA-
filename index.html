
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOVIXA | عالم الأفلام</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#fff;font-family:Arial,sans-serif}
header{background:#111b2e;padding:22px;text-align:center;border-bottom:2px solid #ff365d}
.logo{font-size:34px;font-weight:bold;color:#ff365d}
header p{color:#aaa}
.search{display:flex;gap:8px;padding:15px}
input{width:100%;padding:14px;border:0;border-radius:9px;font-size:16px}
button{border:0;border-radius:9px;padding:12px;background:#ff365d;color:white;font-weight:bold;cursor:pointer}
nav{display:flex;justify-content:center;gap:10px;padding:10px}
nav button{background:#202c42}
h2{padding:0 15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;padding:12px}
.card{background:#172238;border-radius:12px;overflow:hidden}
.card img{width:100%;height:235px;object-fit:cover}
.card h3{font-size:15px;padding:0 9px}
.card p{padding:0 9px;color:#ffc857}
#msg{text-align:center;color:#ffc857;padding:15px}
footer{text-align:center;color:#888;padding:25px}
@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header>
<div class="logo">🎬 MOVIXA</div>
<p>اكتشف عالم الأفلام والمسلسلات</p>
</header>

<div class="search">
<input id="search" placeholder="ابحث عن فيلم أو مسلسل...">
<button onclick="find()">بحث</button>
</div>

<nav>
<button onclick="load('movie')">🎬 الأفلام</button>
<button onclick="load('tv')">📺 المسلسلات</button>
<button onclick="load('trending')">🔥 الأكثر شهرة</button>
</nav>

<h2 id="heading">🔥 الأكثر مشاهدة</h2>
<div id="msg">جاري تحميل المحتوى...</div>
<div class="grid" id="grid"></div>

<footer>MOVIXA © 2026 - جميع الحقوق محفوظة<br>
بيانات وصور الأفلام مقدمة من TMDB</footer>

<script>
const KEY = 'ea713bbc78726b1136fb80e64df7b104';
const BASE = 'https://api.themoviedb.org/3';
const IMG = 'https://image.tmdb.org/t/p/w500';

async function api(path){
 const r=await fetch(BASE+path,{
  headers:{Authorization:'Bearer '+KEY,accept:'application/json'}
 });
 if(!r.ok) throw new Error('خطأ API: '+r.status);
 return r.json();
}

function render(items,type){
 const grid=document.getElementById('grid');
 grid.innerHTML='';
 items.forEach(item=>{
  const title=item.title||item.name||'بدون عنوان';
  const poster=item.poster_path?IMG+item.poster_path:'';
  grid.innerHTML+=`
   <div class="card">
    <img src="${poster}" alt="${title}" onerror="this.style.display='none'">
    <h3>${title}</h3>
    <p>⭐ ${item.vote_average?.toFixed(1)||'غير متوفر'}</p>
   </div>`;
 });
}

async function load(){
  document.getElementById('heading').textContent='🔥 أشهر الأفلام والمسلسلات';

  render(films);

  message.textContent='جاري تحميل المسلسلات...';

  try {
    const r = await fetch(
      'https://api.themoviedb.org/3/tv/popular?language=ar'
      , {
        headers: {
          Authorization: 'Bearer YOUR_TMDB_TOKEN',
          accept: 'application/json'
        }
      }
    );

    if (!r.ok) throw new Error('API Error');

    const data = await r.json();

    shows = data.results || [];

    render([...films, ...shows]);

    message.textContent='تم تحميل الأفلام والمسلسلات بنجاح 🎉';

  } catch(e) {
    message.textContent='تعذر تحميل المحتوى. تحقق من مفتاح API والاتصال بالإنترنت.';
    console.error(e);
  }
}{
 const msg=document.getElementById('msg');
 const heading=document.getElementById('heading');
 document.getElementById('grid').innerHTML='';
 msg.textContent='جاري التحميل...';
 try{
  let data;
  if(type==='trending'){
   heading.textContent='🔥 الأكثر شهرة';
   data=await api('/trending/all/week?language=ar');
  }else{
   heading.textContent=type==='movie'?'🎬 أشهر الأفلام':'📺 أشهر المسلسلات';
   data=await api('/'+type+'/popular?language=ar&page=1');
  }
  render(data.results);
  msg.textContent=data.results.length?'':'لا توجد نتائج';
 }catch(e){
  msg.textContent='تعذر تحميل المحتوى. تحقق من مفتاح API والاتصال بالإنترنت.';
  console.error(e);
 }
}

async function find(){
 const q=document.getElementById('search').value.trim();
 if(!q)return;
 document.getElementById('heading').textContent='🔎 نتائج البحث';
 document.getElementById('msg').textContent='جاري البحث...';
 try{
  const data=await api('/search/multi?query='+encodeURIComponent(q)+'&language=ar&page=1');
  render(data.results.filter(x=>x.media_type!=='person'));
  document.getElementById('msg').textContent=data.results.length?'':'لا توجد نتائج';
 }catch(e){
  document.getElementById('msg').textContent='حدث خطأ أثناء البحث';
 }
}

document.getElementById('search').addEventListener('keydown',e=>{
 if(e.key==='Enter')find();
});

load();
</script>
</body>
</html>
