<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVIXA</title>
<style>
body{margin:0;background:#101018;color:white;font-family:Arial;text-align:center}
header{background:#191927;padding:22px;color:#e5094f;font-size:30px;font-weight:bold}
input{padding:13px;width:75%;margin:20px;border-radius:10px;border:0}
button{padding:12px;background:#e5094f;color:white;border:0;border-radius:8px}
#movies{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:12px}
.card{background:#202030;border-radius:10px;padding:10px}
img{width:100%;border-radius:8px}
h3{font-size:16px}
</style>
</head>
<body>
<header>MOVIXA 🎬</header>
<h2>اكتشف عالم الأفلام والمسلسلات</h2>
<input id="search" placeholder="ابحث عن مسلسل...">
<button onclick="findShows()">بحث</button>
<div id="movies"></div>
<script>
async function findShows(){
const q=document.getElementById("search").value.trim();
if(!q)return;
const box=document.getElementById("movies");
box.innerHTML="جاري البحث...";
try{
const r=await fetch("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(q));
const data=await r.json();
box.innerHTML="";
data.forEach(item=>{
const s=item.show;
const img=s.image?s.image.medium:"https://placehold.co/210x295?text=MOVIXA";
box.innerHTML+=`<div class="card">
<img src="${img}">
<h3>${s.name}</h3>
<p>${s.premiered||"غير معروف"}</p>
</div>`;
});
if(!data.length)box.innerHTML="لم نجد نتائج";
}catch(e){box.innerHTML="حدث خطأ، حاول مجددا";}
}
</script>
</body>
</html>
