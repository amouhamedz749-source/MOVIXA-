
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090812">
<title>MOVIXA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090812;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:30px 15px 18px;background:radial-gradient(ellipse at top,#392052,#100d19 70%)}
.logo{font-size:43px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#fff,#bd8aff,#f06bff);-webkit-background-clip:text;color:transparent}
header p{color:#c9bfd7;font-size:14px}
.search{display:flex;gap:9px;padding:15px;max-width:700px;margin:auto}
input{flex:1;min-width:0;padding:14px;border-radius:13px;border:1px solid #49375e;background:#191522;color:white;font-size:15px;outline:none}
button{border:0;border-radius:12px;padding:12px 17px;background:linear-gradient(110deg,#8749dc,#d044db);color:white;font-weight:bold;cursor:pointer}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px 12px 20px}
nav button{background:#211a2c;border:1px solid #443451;color:#eee;border-radius:30px}
nav button.active{background:linear-gradient(110deg,#8749dc,#d044db)}
.section{max-width:1200px;margin:10px auto;padding:0 15px}
h2{font-size:21px;border-right:4px solid #b45bff;padding-right:10px}
#msg{text-align:center;color:#c8b9dc;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:17px;padding:12px 15px 30px;max-width:1200px;margin:auto}
.card{background:#1b1725;border:1px solid #352941;border-radius:15px;overflow:hidden;padding-bottom:12px;box-shadow:0 7px 20px #0005}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#30283a}
.card h3{font-size:14px;line-height:1.5;padding:0 10px;min-height:40px}
.rating{color:#ffc85a;font-size:13px;padding:0 10px}
footer{text-align:center;color:#958ba2;border-top:1px solid #30283b;padding:25px;margin-top:20px}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:10px}.logo{font-size:38px}nav button{padding:10px 13px;font-size:13px}}
</style>
</head>
<body>
<header>
<div class="logo">MOVIXA</div>
<p>اكتشف عالم الأفلام والمسلسلات 🎬</p>
</header>

<div class="search">
<input id="search" type="search" placeholder="ابحث عن فيلم أو مسلسل...">
<button onclick="searchMovies()">بحث</button>
</div>

<nav>
<button class="active" onclick="load('movie',this)">🎬 الأفلام</button>
<button onclick="load('tv',this)">📺 المسلسلات</button>
<button onclick="load('trending',this)">🔥 الأكثر شهرة</button>
<button onclick="load('top',this)">⭐ الأعلى تقييماً</button>
</nav>

<div class="section"><h2 id="heading">🎬 أشهر الأفلام</h2></div>
<div id="msg">جاري تحميل المحتوى...</div>
<div class="grid" id="grid"></div>

<footer>MOVIXA © 2026 - جميع الحقوق محفوظة</footer>

<script>
const KEY='ea713bbc78726b1136fb80e64df7b104';
const BASE='https://api.themoviedb.org/3';
const IMG='https://image.tmdb.org/t/p/w500';

const grid=document.getElementById('grid');
const msg=document.getElementById('msg');
const heading=document.getElementById('heading');
const searchInput=document.getElementById('search');

async function api(path){
 const sep=path.includes('?')?'&':'?';
 const r=await fetch(BASE+path+sep+'api_key='+encodeURIComponent(KEY)+'&language=ar');
 if(!r.ok)throw new Error('API '+r.status);
 return r.json();
}

function render(items){
 grid.innerHTML='';
 if(!items.length){
  msg.textContent='لم يتم العثور على نتائج';
  return;
 }
 items.forEach(item=>{
  const card=document.createElement('div');
  card.className='card';

  const img=document.createElement('img');
  img.loading='lazy';
  img.alt=item.title||item.name||'MOVIXA';
  if(item.poster_path)img.src=IMG+item.poster_path;

  const title=document.createElement('h3');
  title.textContent=item.title||item.name||'بدون عنوان';

  const rating=document.createElement('div');
  rating.className='rating';
  rating.textContent='⭐ '+(item.vote_average?Number(item.vote_average).toFixed(1):'غير متوفر');

  card.append(img,title,rating);
  grid.appendChild(card);
 });
}

async function load(type,button){
 grid.innerHTML='';
 msg.textContent='جاري تحميل المحتوى...';

 if(button){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
 }

 let path;
 if(type==='movie'){
  heading.textContent='🎬 أشهر الأفلام';
  path='/movie/popular';
 }else if(type==='tv'){
  heading.textContent='📺 أشهر المسلسلات';
  path='/tv/popular';
 }else if(type==='trending'){
  heading.textContent='🔥 الأكثر شهرة';
  path='/trending/all/week';
 }else{
  heading.textContent='⭐ الأعلى تقييماً';
  path='/movie/top_rated';
 }

 try{
  const data=await api(path);
  render(data.results||[]);
  msg.textContent='تم تحميل المحتوى بنجاح 🎉';
 }catch(error){
  msg.textContent='خطأ في التحميل: '+error.message;
 }
}

async function searchMovies(){
 const q=searchInput.value.trim();
 if(!q){
  msg.textContent='اكتب اسم الفيلم أو المسلسل';
  return;
 }
 heading.textContent='🔎 نتائج البحث';
 msg.textContent='جاري البحث...';
 grid.innerHTML='';
 try{
  const data=await api('/search/multi?query='+encodeURIComponent(q));
  render((data.results||[]).filter(x=>x.media_type!=='person'));
  msg.textContent='انتهى البحث 🎬';
 }catch(error){
  msg.textContent='خطأ في البحث: '+error.message;
 }
}

searchInput.addEventListener('keydown',e=>{
 if(e.key==='Enter')searchMovies();
});

load('movie');
</script>
</body>
</html>
