
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOVIXA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:white;font-family:Arial}
header{background:#1c1c29;padding:22px;text-align:center}
h1{color:#ff3155;margin:0;font-size:34px}
header p{color:#bbb}
main{padding:15px;max-width:1100px;margin:auto}
input{width:100%;padding:14px;border:0;border-radius:10px;font-size:16px}
.buttons{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}
button{background:#ff3155;color:white;border:0;padding:12px 18px;border-radius:9px;font-size:15px}
button:active{opacity:.7}
#movies{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.movie{background:#20202d;border-radius:10px;overflow:hidden}
.movie img{width:100%;height:220px;object-fit:cover}
.movie h3{padding:0 10px;font-size:15px}
.movie p{padding:0 10px;color:#bbb;font-size:13px}
#message{text-align:center;color:#ffbd55;padding:15px}
@media(min-width:650px){#movies{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<h1>MOVIXA 🎬</h1>
<p>اكتشف أفضل الأفلام والمسلسلات</p>
</header>
<main>
<input id="search" placeholder="🔎 ابحث عن فيلم أو مسلسل...">
<div class="buttons">
<button onclick="loadMovies('movie')">🎬 أفلام</button>
<button onclick="loadMovies('tv')">📺 مسلسلات</button>
<button onclick="loadMovies('all')">🔥 الكل</button>
</div>
<div id="message">جاري تحميل الأفلام...</div>
<div id="movies"></div>
</main>
<script>
const API='https://api.themoviedb.org/3';
const KEY='ضع_مفتاح_API_هنا';
let current='all';
let data=[];

async function loadMovies(type='all'){
current=type;
document.getElementById('message').textContent='جاري التحميل...';
document.getElementById('movies').innerHTML='';
if(KEY==='ضع_مفتاح_API_هنا'){
document.getElementById('message').textContent='يلزم إدخال مفتاح TMDb API لتشغيل الأفلام.';
return;
}
try{
let urls=[];
if(type==='movie'||type==='all')urls.push(API+'/trending/movie/week?api_key='+KEY+'&language=ar');
if(type==='tv'||type==='all')urls.push(API+'/trending/tv/week?api_key='+KEY+'&language=ar');
let results=await Promise.all(urls.map(u=>fetch(u).then(r=>r.json())));
data=results.flatMap(x=>x.results||[]);
display(data);
document.getElementById('message').textContent='تم التحميل بنجاح';
}catch(e){
document.getElementById('message').textContent='حدث خطأ في الاتصال. حاول مجددا.';
}
}

function display(items){
const box=document.getElementById('movies');
box.innerHTML='';
items.forEach(item=>{
let name=item.title||item.name||'بدون عنوان';
let poster=item.poster_path?'https://image.tmdb.org/t/p/w500'+item.poster_path:'';
box.innerHTML+=`<div class="movie">
<img src="${poster}" alt="${name}">
<h3>${name}</h3>
<p>⭐ ${item.vote_average||'غير متوفر'}</p>
</div>`;
});
if(!items.length)box.innerHTML='<p>لا توجد نتائج</p>';
}

document.getElementById('search').addEventListener('input',async e=>{
let q=e.target.value.trim();
if(!q){loadMovies(current);return;}
if(KEY==='ضع_مفتاح_API_هنا')return;
try{
let r=await fetch(API+'/search/multi?api_key='+KEY+'&language=ar&query='+encodeURIComponent(q));
let j=await r.json();
display(j.results||[]);
}catch(e){}
});

loadMovies('all');
</script>
</body>
</html>
